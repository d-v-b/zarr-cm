name: Check Upstream Drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  # Keep in step with ci.yml.
  JUST_VERSION: "1.58.0"

jobs:
  check-upstream:
    name: Detect schema drift against upstream main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Check for upstream schema drift
        run: uvx --from rust-just==${{ env.JUST_VERSION }} just check-upstream
